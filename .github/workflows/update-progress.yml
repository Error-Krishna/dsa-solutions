name: Update DSA Progress

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dsa-progress-update
  cancel-in-progress: false

jobs:
  update-progress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update and push progress safely
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt..."

            git fetch origin main
            git reset --hard origin/main

            python .github/scripts/update_progress.py

            git add README.md

            if git diff --cached --quiet; then
              echo "README is already up to date."
              exit 0
            fi

            git commit -m "chore: update DSA progress tracker"

            if git push origin HEAD:main; then
              echo "Progress successfully pushed."
              exit 0
            fi

            echo "Push rejected. Fetching latest changes and retrying..."
          done

          echo "ERROR: Unable to push after 5 attempts."
          exit 1
